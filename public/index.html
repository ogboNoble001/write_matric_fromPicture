<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matric Extractor — FUTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --accent: #c8f04a;
      --accent-dim: rgba(200, 240, 74, 0.08);
      --text: #f0f0f0;
      --muted: #555;
      --danger: #ff4d4d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 2rem 2.5rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 1.5rem;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      line-height: 1;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .tagline {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding-bottom: 0.35rem;
    }

    /* ── MAIN LAYOUT ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 0;
    }

    /* ── LEFT PANEL ── */
    .panel-left {
      border-right: 1px solid var(--border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* Drop Zone */
    .drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .drop-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .drop-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Preview */
    .preview-wrap {
      display: none;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-wrap.show { display: block; }

    .preview-wrap img {
      width: 100%;
      display: block;
      max-height: 260px;
      object-fit: cover;
    }

    .preview-clear {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .preview-clear:hover { background: var(--danger); }

    /* Extract Button */
    .extract-btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .extract-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(200, 240, 74, 0.25);
    }

    .extract-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0a0a0a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .extract-btn.loading .spinner { display: block; }
    .extract-btn.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Stats */
    .stats {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .stats.show { display: grid; }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }

    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--accent);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
    }

    /* Download buttons */
    .download-group {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }
    .download-group.show { display: flex; }

    .dl-btn {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .dl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dl-btn span { font-size: 1rem; }

    /* ── RIGHT PANEL ── */
    .panel-right {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow: hidden;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .search-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.85rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      width: 220px;
      transition: border-color 0.15s;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 3rem;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 0.85rem;
      text-align: center;
    }

    /* Table */
    .table-wrap {
      display: none;
      flex: 1;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .table-wrap.show { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    thead th {
      background: var(--surface);
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--accent-dim); }

    td {
      padding: 0.65rem 1rem;
      color: var(--text);
      vertical-align: middle;
    }

    .td-matric {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .td-dept {
      color: #888;
      font-size: 0.75rem;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .badge-male { background: rgba(100, 160, 255, 0.1); color: #64a0ff; }
    .badge-female { background: rgba(255, 150, 200, 0.1); color: #ff96c8; }

    /* Error */
    .error-bar {
      display: none;
      background: rgba(255, 77, 77, 0.08);
      border: 1px solid rgba(255, 77, 77, 0.3);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      color: var(--danger);
    }
    .error-bar.show { display: block; }

    /* JSON view toggle */
    .view-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn {
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .json-view {
      display: none;
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      overflow: auto;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.7;
      color: #a8c97f;
      white-space: pre;
    }
    .json-view.show { display: block; }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">MATRIC.EX</div>
  <div class="tagline">Image → JSON · Powered by Gemini Vision</div>
</header>

<main>
  <!-- LEFT -->
  <div class="panel-left">
    <div>
      <div class="section-label">Upload Image</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" />
        <span class="drop-icon">📷</span>
        <div class="drop-title">Drop image or click to browse</div>
        <div class="drop-sub">JPG, PNG, WEBP · Max 10MB</div>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" src="" alt="preview" />
        <button class="preview-clear" id="clearBtn">✕</button>
      </div>
    </div>

    <div class="error-bar" id="errorBar"></div>

    <button class="extract-btn" id="extractBtn" disabled>
      <div class="spinner"></div>
      <span class="btn-text">EXTRACT MATRIC DATA</span>
    </button>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Students</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statDepts">0</div>
        <div class="stat-label">Departments</div>
      </div>
    </div>

    <div class="download-group" id="downloadGroup">
      <div class="section-label">Export</div>
      <button class="dl-btn" id="dlJson"><span>⬇</span> Download JSON</button>
      <button class="dl-btn" id="dlCsv"><span>⬇</span> Download CSV</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div class="results-header">
      <div class="section-label" style="margin:0">Results</div>
      <div style="display:flex; gap:0.75rem; align-items:center">
        <input class="search-input" id="searchInput" placeholder="Search name or matric..." />
        <div class="view-toggle">
          <button class="toggle-btn active" id="tableToggle">Table</button>
          <button class="toggle-btn" id="jsonToggle">JSON</button>
        </div>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎓</div>
      <div class="empty-text">Upload an image of a matric list<br/>and hit Extract</div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Matric No.</th>
            <th>Department</th>
            <th>Level</th>
            <th>Gender</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <pre class="json-view" id="jsonView"></pre>
  </div>
</main>

<script>
  let extractedData = [];
  let filteredData = [];

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('previewImg');
  const clearBtn = document.getElementById('clearBtn');
  const extractBtn = document.getElementById('extractBtn');
  const errorBar = document.getElementById('errorBar');
  const stats = document.getElementById('stats');
  const downloadGroup = document.getElementById('downloadGroup');
  const tableWrap = document.getElementById('tableWrap');
  const tableBody = document.getElementById('tableBody');
  const jsonView = document.getElementById('jsonView');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const tableToggle = document.getElementById('tableToggle');
  const jsonToggle = document.getElementById('jsonToggle');

  let currentFile = null;

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  function loadFile(file) {
    currentFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewWrap.classList.add('show');
      dropZone.style.display = 'none';
      extractBtn.disabled = false;
    };
    reader.readAsDataURL(file);
    hideError();
  }

  clearBtn.addEventListener('click', () => {
    currentFile = null;
    fileInput.value = '';
    previewWrap.classList.remove('show');
    dropZone.style.display = '';
    extractBtn.disabled = true;
  });

  // Extract
  extractBtn.addEventListener('click', async () => {
    if (!currentFile) return;

    extractBtn.classList.add('loading');
    extractBtn.disabled = true;
    hideError();

    const formData = new FormData();
    formData.append('image', currentFile);

    try {
      const res = await fetch('/api/extract-matric', {
        method: 'POST',
        body: formData
      });

      const json = await res.json();

      if (!res.ok || !json.success) {
        throw new Error(json.details || json.error || 'Extraction failed');
      }

      extractedData = json.data;
      filteredData = [...extractedData];
      renderResults();

    } catch (err) {
      showError(err.message);
    } finally {
      extractBtn.classList.remove('loading');
      extractBtn.disabled = false;
    }
  });

  function renderResults() {
    const depts = new Set(extractedData.map(s => s.department).filter(Boolean));
    document.getElementById('statTotal').textContent = extractedData.length;
    document.getElementById('statDepts').textContent = depts.size;

    stats.classList.add('show');
    downloadGroup.classList.add('show');
    emptyState.style.display = 'none';

    renderTable(filteredData);
    jsonView.textContent = JSON.stringify(filteredData, null, 2);
  }

  function renderTable(data) {
    tableWrap.classList.add('show');
    tableBody.innerHTML = data.map((s, i) => `
      <tr>
        <td style="color:var(--muted)">${i + 1}</td>
        <td>${s.name || '—'}</td>
        <td class="td-matric">${s.matric || '—'}</td>
        <td class="td-dept">${s.department || '—'}</td>
        <td>${s.level || '—'}</td>
        <td><span class="badge badge-${(s.gender || '').toLowerCase()}">${s.gender || '—'}</span></td>
      </tr>
    `).join('');
  }

  // Search
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase();
    filteredData = extractedData.filter(s =>
      (s.name || '').toLowerCase().includes(q) ||
      (s.matric || '').toLowerCase().includes(q) ||
      (s.department || '').toLowerCase().includes(q)
    );
    renderTable(filteredData);
    jsonView.textContent = JSON.stringify(filteredData, null, 2);
  });

  // View toggle
  tableToggle.addEventListener('click', () => {
    tableToggle.classList.add('active');
    jsonToggle.classList.remove('active');
    tableWrap.classList.add('show');
    jsonView.classList.remove('show');
  });

  jsonToggle.addEventListener('click', () => {
    jsonToggle.classList.add('active');
    tableToggle.classList.remove('active');
    jsonView.classList.add('show');
    tableWrap.classList.remove('show');
  });

  // Downloads
  document.getElementById('dlJson').addEventListener('click', () => {
    download('matric-data.json', JSON.stringify(extractedData, null, 2), 'application/json');
  });

  document.getElementById('dlCsv').addEventListener('click', () => {
    const headers = ['name', 'matric', 'department', 'level', 'gender'];
    const rows = extractedData.map(s => headers.map(h => `"${(s[h] || '').replace(/"/g, '""')}"`).join(','));
    download('matric-data.csv', [headers.join(','), ...rows].join('\n'), 'text/csv');
  });

  function download(filename, content, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  function showError(msg) {
    errorBar.textContent = `⚠ ${msg}`;
    errorBar.classList.add('show');
  }

  function hideError() {
    errorBar.classList.remove('show');
  }
</script>
</body>
</html>
